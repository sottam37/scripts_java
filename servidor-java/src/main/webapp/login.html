
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Biblioteca Virtual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            font-weight: 600;
            color: #343a40;
        }

        .login-icon {
            font-size: 38px;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-11 col-sm-8 col-md-5 col-lg-4">

                <div class="card login-card p-4 bg-white">

                    <div class="text-center mb-4">

                        <i class="fas fa-book-reader login-icon"></i>

                        <h5 class="login-title mt-2">
                            Biblioteca Virtual
                        </h5>

                        <p class="text-muted mb-0">
                            Acesse sua conta
                        </p>

                    </div>

                    <!-- Mensagens de retorno da Servlet -->

                    <div id="mensagemErro"
                         class="alert alert-danger text-center d-none">
                    </div>

                    <!-- Formulário conectado à LoginServlet -->

                    <form action="login" method="POST">

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                E-mail
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Digite seu e-mail"
                                    autocomplete="username"
                                    required
                                    autofocus>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="senha" class="form-label">
                                Senha
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="senha"
                                    name="senha"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="toggleSenha">

                                    <i class="fas fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">

                            <i class="fas fa-sign-in-alt me-2"></i>
                            Entrar

                        </button>

                        <a href="cadastro"
                           class="btn btn-link w-100 mt-2">

                            <i class="fas fa-user-plus me-1"></i>
                            Quero me cadastrar

                        </a>

                    </form>

                    <div class="text-center mt-3">

                        <small class="text-muted">
                            Biblioteca Virtual &copy; 2026
                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // Mostrar e ocultar senha

        document.getElementById("toggleSenha")
            .addEventListener("click", function () {

                const campo = document.getElementById("senha");
                const icone = this.querySelector("i");

                if (campo.type === "password") {

                    campo.type = "text";

                    icone.classList.replace(
                        "fa-eye",
                        "fa-eye-slash"
                    );

                } else {

                    campo.type = "password";

                    icone.classList.replace(
                        "fa-eye-slash",
                        "fa-eye"
                    );

                }

            });

        // Exibir mensagens enviadas pela Servlet

        const parametros = new URLSearchParams(
            window.location.search
        );

        const erro = parametros.get("erro");

        const mensagem = document.getElementById("mensagemErro");

        if (erro === "credenciais") {

            mensagem.textContent = "E-mail ou senha inválidos.";

            mensagem.classList.remove("d-none");

        } else if (erro === "sistema") {

            mensagem.textContent = "Erro ao processar o login. Tente novamente.";

            mensagem.classList.remove("d-none");

        }

    </script>

</body>
</html>
