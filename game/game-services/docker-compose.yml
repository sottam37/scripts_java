services:
  mariadb-server:
    image: mariadb:11.4
    container_name: mariadb-server

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    ports:
      - "${MARIADB_PORT}:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - dev-network

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:

networks:
  dev-network:
    driver: bridge
